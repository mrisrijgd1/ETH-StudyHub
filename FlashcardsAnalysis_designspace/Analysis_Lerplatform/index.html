<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lernkarten · Analysis I · StudyHub</title>
  <meta name="description" content="Analysis I flashcards: script chapters, proof practice, weak cards, streak and progress.">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="aa41861b-f523-4aaa-95f8-69d90cb0a3d8"></script>
  <script defer src="../../assets/umami-kit.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' },
      options: { enableMenu: false },
      startup: { typeset: false }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js"></script>
  <link rel="stylesheet" href="fc/app.css">
  <!-- StudyHub shell: shared header, Design menu, accounts and design tokens (absent when this repo runs on its own) -->
  <script defer src="../../assets/account.js"></script>
</head>
<body>
  <main class="fc-app learning-app" id="fc-root">
    <div class="fc-wrap">
      <nav class="fc-nav" id="fc-nav" aria-label="Lernkarten"></nav>
      <div id="fc-view" tabindex="-1"></div>
    </div>
  </main>

  <div class="fc-overlay" id="fc-finish" role="dialog" aria-modal="true" aria-labelledby="fc-finish-h">
    <div class="fc-modal">
      <h2 id="fc-finish-h"></h2>
      <div class="kao" id="fc-finish-kao" aria-hidden="true"></div>
      <div class="fc-stats3" id="fc-finish-stats"></div>
      <p id="fc-finish-text"></p>
      <div class="fc-row" style="justify-content:center;margin-top:18px" id="fc-finish-btns"></div>
    </div>
  </div>
  <div class="fc-toast" id="fc-toast" role="status" aria-live="polite"></div>
  <div class="fc-sr" id="fc-live" aria-live="polite"></div>

  <!-- Script-chapter decks: one file per chapter, each defines window.FLASHCARDS_KAPITEL_<N>.
       A new chapter = its data file + one tag here; its box activates automatically. -->
  <script src="data_kapitel1.js"></script>
  <script src="data_kapitel2.js"></script>
  <script src="data_kapitel3.js"></script>
  <script src="data_kapitel4.js"></script>
  <script src="data_kapitel5.js"></script>
  <script src="data_kapitel6.js"></script>
  <script src="data_kapitel7.js"></script>

  <script src="fc/config.js"></script>
  <script src="fc/app.js"></script>
</body>
</html>
