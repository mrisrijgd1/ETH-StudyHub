<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Exam Dive · ETH StudyHub</title>
  <meta name="description" content="Exam Dive: ein Pixel-Tiefsee-Spiel mit Multiple-Choice-Fragen zu Analysis I und Physik I (ETH).">
  <meta name="theme-color" content="#0b1530">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body class="mode-start">
  <canvas id="sea" role="img" aria-label="Pixel-Meer mit Taucher an der Leine"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <div id="app">
    <header class="topbar">
      <a class="pixel-link" href="../index.html" data-i18n="back_hub">← StudyHub</a>
      <div class="tools">
        <button id="btn-lang" class="pixel-btn small" type="button">EN</button>
        <button id="btn-sound" class="pixel-btn small" type="button" aria-pressed="false">Ton aus</button>
      </div>
    </header>

    <main>
      <!-- START -->
      <section id="screen-start" class="screen" aria-labelledby="start-h1">
        <div class="hero">
          <canvas id="title-canvas" class="title-canvas" width="62" height="10" aria-hidden="true"></canvas>
          <h1 id="start-h1" class="sr-only" data-i18n="title">Exam Dive</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>

        <div class="panel start-panel">
          <fieldset class="field">
            <legend data-i18n="subject">Fach</legend>
            <div class="seg" id="subject-group"></div>
          </fieldset>

          <fieldset class="field">
            <legend data-i18n="chapters">Kapitel</legend>
            <div class="chip-tools">
              <button id="chips-all" class="pixel-btn tiny" type="button" data-i18n="chapters_all">alle</button>
              <button id="chips-none" class="pixel-btn tiny" type="button" data-i18n="chapters_none">keine</button>
            </div>
            <div id="chips" class="chips"></div>
          </fieldset>

          <fieldset class="field">
            <legend data-i18n="timer">Zeit pro Frage</legend>
            <div class="seg" id="timer-group"></div>
          </fieldset>

          <p id="start-note" class="note" aria-live="polite"></p>
          <button id="btn-dive" class="pixel-btn big" type="button" data-i18n="dive">ABTAUCHEN</button>
          <p class="keys" data-i18n="keys_help"></p>
          <p id="bank-info" class="bank-info"></p>
        </div>

        <div class="panel">
          <h2 data-i18n="bests">Bestwerte</h2>
          <p class="hint" data-i18n="bests_hint"></p>
          <div id="bests" class="table-wrap"></div>
        </div>

        <div class="panel">
          <h2 data-i18n="history">Letzte Tauchgänge</h2>
          <ol id="history" class="history"></ol>
        </div>
      </section>

      <!-- DIVE -->
      <section id="screen-dive" class="screen" hidden>
        <div class="hud">
          <div class="gauge-wrap">
            <canvas id="gauge" class="gauge" width="41" height="7" aria-hidden="true"></canvas>
            <span id="hud-depth" class="sr-only"></span>
          </div>
          <div class="hud-text">
            <span id="hud-zone" class="hud-zone"></span>
            <span id="hud-q" class="hud-q"></span>
          </div>
          <button id="btn-abort" class="pixel-btn small" type="button" data-i18n="abort">Auftauchen</button>
        </div>
        <article id="card" class="card"></article>
      </section>

      <!-- GAME OVER -->
      <section id="screen-over" class="screen" hidden aria-labelledby="over-h2">
        <div class="panel over-panel">
          <canvas id="over-title" class="over-title" width="80" height="10" aria-hidden="true"></canvas>
          <h2 id="over-h2" class="sr-only"></h2>
          <canvas id="over-depth" class="over-depth" width="41" height="7" aria-hidden="true"></canvas>
          <dl id="over-stats" class="stats"></dl>
          <p id="over-tags" class="tags"></p>
          <div id="over-ending" class="ending" hidden></div>
          <div class="actions">
            <button id="btn-again" class="pixel-btn" type="button" data-i18n="again">Nochmal tauchen</button>
            <button id="btn-review-last" class="pixel-btn" type="button" data-i18n="review">Fragen dieses Tauchgangs</button>
            <button id="btn-start" class="pixel-btn" type="button" data-i18n="to_start">Zum Start</button>
          </div>
        </div>
      </section>
    </main>

    <div id="review" class="modal" role="dialog" aria-modal="true" aria-labelledby="review-title" hidden>
      <div class="modal-box">
        <header class="modal-head">
          <h2 id="review-title"></h2>
          <button id="btn-review-close" class="pixel-btn small" type="button" data-i18n="close">Schliessen</button>
        </header>
        <div id="review-body"></div>
      </div>
    </div>

    <div id="live" class="sr-only" aria-live="polite"></div>
  </div>

  <noscript><p class="noscript">Exam Dive braucht JavaScript.</p></noscript>
</body>
</html>
