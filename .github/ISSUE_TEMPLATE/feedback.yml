name: Feedback
description: A mistake, something missing, a wish, or something you liked
title: "[Feedback] "
body:
  - type: input
    id: page
    attributes:
      label: Which page?
      placeholder: e.g. Analysis lesson 5, section 2
  - type: textarea
    id: what
    attributes:
      label: What's wrong, missing or great?
    validations:
      required: true
