name: Sync FlashcardsAnalysis designspace

# Copies Rachel's flashcards repo into FlashcardsAnalysis_designspace/ and
# PROPOSES the update as a pull request (branch sync/flashcards). Nothing goes
# public until the pull request is reviewed and merged.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-flashcards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repo
        uses: actions/checkout@v4
        with:
          repository: mrisrijgd1/ETH-StudyHub
          ref: main
          path: destination
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          repository: random-1374/FlashcardsAnalysis_designspace
          ref: main
          path: source
          token: ${{ secrets.FLASHCARDS_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Sync source contents into destination folder
        run: |
          rm -rf destination/FlashcardsAnalysis_designspace
          mkdir -p destination/FlashcardsAnalysis_designspace
          rsync -a --delete --exclude='.git' --exclude='.github' source/ destination/FlashcardsAnalysis_designspace/

      - name: Propose the update as a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd destination
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "main already matches the flashcards repo. Nothing to propose."
            exit 0
          fi
          git checkout -b sync/flashcards
          git commit -m "Sync FlashcardsAnalysis_designspace from the flashcards repo"
          git push --force origin sync/flashcards
          if [ -z "$(gh pr list --head sync/flashcards --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head sync/flashcards \
              --title "Flashcards update from Rachel's repo (please review)" \
              --body "Automatic copy of random-1374/FlashcardsAnalysis_designspace into FlashcardsAnalysis_designspace/. This repo is public: check that every file may be published (no copyrighted PDFs) before merging."
          else
            echo "An open pull request already exists; its branch was updated."
          fi
