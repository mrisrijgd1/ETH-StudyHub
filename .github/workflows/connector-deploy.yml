# The StudyHub connector (MCP server) runs on our own Swiss server: https://study-hub.ch/mcp (api/mcp.php,
# deployed with the website). This workflow
#   1. applies the login-side SQL at Supabase (Supabase only does the login now),
#   2. deploys the tiny forwarder at the old Supabase address, so connectors added before the move keep working,
#   3. builds the course content index (+ page images) and copies it to studyhub-data/connector/ on Infomaniak.
# Secrets: SUPABASE_ACCESS_TOKEN (Supabase personal access token) and INFOMANIAK_SSH_KEY (deploy key).
# Runs on every push to main (so new lessons reach the connector) and by hand (Actions -> Connector deploy -> Run workflow).
name: Connector deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: connector-deploy, cancel-in-progress: false }
permissions: { contents: read }
env:
  REF: qgntwqqmpdiwexnwsmnm
  SUPABASE_URL: https://qgntwqqmpdiwexnwsmnm.supabase.co
  DEPLOY_HOST: 2r672z.ftp.infomaniak.com
  DEPLOY_USER: 2r672z_deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets
        env: { T: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", K: "${{ secrets.INFOMANIAK_SSH_KEY }}" }
        run: |
          test -n "$T" || { echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN first."; exit 1; }
          test -n "$K" || { echo "::error::Add the repository secret INFOMANIAK_SSH_KEY first."; exit 1; }
      - name: Login database at Supabase (SQL files)
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          for f in connector/sql/*.sql; do
            echo "running $f"
            python3 -c "import json,sys;print(json.dumps({'query':open(sys.argv[1]).read()}))" "$f" > /tmp/q.json
            code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json "https://api.supabase.com/v1/projects/$REF/database/query")
            echo "status $code"; head -c 600 /tmp/r.txt; echo
            test "$code" -lt 300
          done
      - name: Deploy the forwarder at the old address
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: npx -y supabase@2.122.1 functions deploy studyhub-mcp --project-ref "$REF" --no-verify-jwt --use-api --workdir connector
      - name: Build the content index
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils >/dev/null
          pip install -q beautifulsoup4==4.12.3
          python3 connector/build/build_content.py . /tmp/connector-out --images
      - name: Copy the content to the Swiss hosting (studyhub-data/connector, outside the website)
        env: { SSH_KEY: "${{ secrets.INFOMANIAK_SSH_KEY }}" }
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          S="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes $DEPLOY_USER@$DEPLOY_HOST"
          $S "mkdir -p studyhub-data/connector && chmod 700 studyhub-data studyhub-data/connector"
          # content.json last, so the server never sees a new index that points at images not copied yet
          rsync -rlz --checksum --delete --exclude='content.json' -e "ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes" /tmp/connector-out/ "$DEPLOY_USER@$DEPLOY_HOST:studyhub-data/connector/" | tail -3
          rsync -lz --checksum -e "ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes" /tmp/connector-out/content.json "$DEPLOY_USER@$DEPLOY_HOST:studyhub-data/connector/content.json"
      - name: Smoke test (both addresses)
        run: |
          curl -s "https://study-hub.ch/.well-known/oauth-protected-resource/mcp"; echo
          # the website deploy (which carries api/mcp.php) runs at the same time: give it up to 5 minutes
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' "https://study-hub.ch/mcp")
            [ "$code" = 401 ] && break; sleep 10
          done
          echo "unauthenticated call at study-hub.ch/mcp -> $code (401 expected)"; test "$code" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' "$SUPABASE_URL/functions/v1/studyhub-mcp")
          echo "unauthenticated call at the old address -> $code (401 expected)"; test "$code" = 401
      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
