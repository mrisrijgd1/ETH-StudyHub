name: Nightly backup to Infomaniak

# Copies all StudyHub account data (every table in the Supabase "public" schema, plus the
# login list: id, e-mail, created, last sign-in) to the Swiss hosting every night, so a full copy
# exists in Switzerland. Saved OUTSIDE the website in studyhub-data/backups/, one gzip per day,
# kept 30 days. Uses the two secrets that already exist: SUPABASE_ACCESS_TOKEN and INFOMANIAK_SSH_KEY.

on:
  schedule:
    - cron: '23 2 * * *'   # 02:23 UTC every night
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-infomaniak
  cancel-in-progress: false

env:
  REF: qgntwqqmpdiwexnwsmnm
  DEPLOY_HOST: 2r672z.ftp.infomaniak.com
  DEPLOY_USER: 2r672z_deploy

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Export the data from Supabase
        env: { SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}" }
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN missing"; exit 1; }
          python3 - <<'PY'
          import json, os, urllib.request, gzip, datetime
          tok = os.environ['SUPABASE_ACCESS_TOKEN']; ref = os.environ['REF']
          def q(sql):
              req = urllib.request.Request(f'https://api.supabase.com/v1/projects/{ref}/database/query',
                  data=json.dumps({'query': sql}).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)
          tables = [r['table_name'] for r in q("select table_name from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1")]
          out = {'created_utc': datetime.datetime.utcnow().isoformat() + 'Z', 'tables': {}}
          for t in tables:
              out['tables'][t] = q(f'select coalesce(json_agg(x), \'[]\'::json) as rows from public."{t}" x')[0]['rows']
          out['auth_users'] = q("select coalesce(json_agg(x),'[]'::json) as rows from (select id, email, created_at, last_sign_in_at from auth.users) x")[0]['rows']
          name = 'studyhub-' + datetime.datetime.utcnow().strftime('%Y-%m-%d') + '.json.gz'
          with gzip.open(name, 'wt', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False)
          print('tables:', {t: len(v) for t, v in out['tables'].items()}, 'users:', len(out['auth_users']))
          print('file:', name, os.path.getsize(name), 'bytes')
          open(os.environ['GITHUB_ENV'], 'a').write('BACKUP_FILE=' + name + '\n')
          PY

      - name: Copy it to the Swiss hosting (outside the website) and keep 30 days
        env: { SSH_KEY: "${{ secrets.INFOMANIAK_SSH_KEY }}" }
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          S="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes $DEPLOY_USER@$DEPLOY_HOST"
          $S "mkdir -p studyhub-data/backups && chmod 700 studyhub-data studyhub-data/backups"
          scp -i ~/.ssh/deploy_key -o BatchMode=yes "$BACKUP_FILE" "$DEPLOY_USER@$DEPLOY_HOST:studyhub-data/backups/"
          $S "find studyhub-data/backups -name 'studyhub-*.json.gz' -mtime +30 -delete; ls -la studyhub-data/backups | tail -5"
          rm -f "$BACKUP_FILE"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
