# One-off (Mridul chose "Delete them", 25 Nov 2026): empties and removes the old Supabase storage buckets
# connector, library and dive. Their content now lives on Infomaniak (studyhub-data/), sources stay on GitHub.
# Prints only counts, never file contents or keys. Safe to rerun.
name: Remove old Supabase storage copies
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      REF: qgntwqqmpdiwexnwsmnm
      SUPABASE_URL: https://qgntwqqmpdiwexnwsmnm.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Empty and remove the buckets
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          ref, base, pat = os.environ['REF'], os.environ['SUPABASE_URL'], os.environ['SUPABASE_ACCESS_TOKEN']
          def req(url, method='GET', body=None, key=None):
              h = {'Content-Type': 'application/json'}
              h['Authorization'] = 'Bearer ' + (key or pat)
              if key: h['apikey'] = key
              r = urllib.request.Request(url, method=method, headers=h, data=None if body is None else json.dumps(body).encode())
              try:
                  with urllib.request.urlopen(r, timeout=60) as resp: t = resp.read(); return resp.status, (json.loads(t) if t else None)
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          s, keys = req(f'https://api.supabase.com/v1/projects/{ref}/api-keys?reveal=true')
          assert s == 200, f'could not read project keys ({s})'
          key = next(k['api_key'] for k in keys if k.get('name') == 'service_role' or k.get('type') == 'secret')
          print('::add-mask::' + key)
          def walk(bucket, prefix=''):
              out, off = [], 0
              while True:
                  s, items = req(f'{base}/storage/v1/object/list/{bucket}', 'POST', {'prefix': prefix, 'limit': 1000, 'offset': off}, key)
                  if s != 200 or not items: break
                  for it in items:
                      p = (prefix + '/' if prefix else '') + it['name']
                      if it.get('id') is None: out += walk(bucket, p)   # folder
                      else: out.append(p)
                  if len(items) < 1000: break
                  off += 1000
              return out
          for b in ['connector', 'library', 'dive']:
              files = walk(b)
              for i in range(0, len(files), 500):
                  s, _ = req(f'{base}/storage/v1/object/{b}', 'DELETE', {'prefixes': files[i:i+500]}, key)
                  assert s == 200, f'delete in {b} failed ({s})'
              left = len(walk(b))
              s, _ = req(f'{base}/storage/v1/bucket/{b}', 'DELETE', None, key)
              print(f'{b}: {len(files)} files deleted, {left} left, bucket removed: {s == 200} ({s})')
          PY
