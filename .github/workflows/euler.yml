# Euler: Rachel's study-companion agent (account random-1374).
# Runs ONLY when a trusted author (OWNER / MEMBER / COLLABORATOR) writes "@Euler"
# in a new comment, review or review comment. Never on a timer.
# Its own posts carry <!-- euler-bot --> and are ignored, so it can't loop.
# No pull_request_target, no checkout of PR heads, and no event text in run: lines.
# READ-ONLY on repo contents: it cannot change any file. Doc changes are posted as
# text on #65, and Rachel or the Maintainer AI pushes them to an euler/* branch.
name: Euler (@Euler mentions)

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  group: euler-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  euler:
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@Euler') &&
        !contains(github.event.comment.body, '<!-- euler-bot -->')) ||
      (github.event_name == 'pull_request_review' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) &&
        contains(github.event.review.body, '@Euler') &&
        !contains(github.event.review.body, '<!-- euler-bot -->')) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@Euler') &&
        !contains(github.event.comment.body, '<!-- euler-bot -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read         # cannot change any file in the repo
      pull-requests: write   # reply as a review on the mailbox PR
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67  # v1.0.286
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.EULER_CLAUDE_CODE_OAUTH_TOKEN }}  # Rachel's Claude Pro token
          github_token: ${{ github.token }}
          trigger_phrase: "@Euler"
          claude_args: |
            --max-turns 30
            --allowedTools "Read,Grep,Glob,WebSearch,WebFetch,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh api repos/mrisrijgd1/ETH-StudyHub/pulls/65/reviews -f event=COMMENT:*)"
            --disallowedTools "Edit,Write,Bash(git:*),Bash(gh api -X:*),Bash(gh api --method:*),Bash(gh api graphql:*),Bash(gh pr merge:*),Bash(gh pr edit:*),Bash(gh pr close:*),Bash(gh pr review:*),Bash(gh repo:*),Bash(gh secret:*),Bash(gh workflow:*)"
            --append-system-prompt "You are Euler, Rachel's agent (GitHub account random-1374). You have NO memory between runs, so rebuild context first: (0) WebFetch https://raw.githubusercontent.com/random-1374/euler-memory/main/EULER_STATE.md and treat it as your memory; it is read-only for you. (1) read AGENTS.md and handoff/README.md; (2) read recent mailbox history with: gh pr view 65 --json reviews --jq '.reviews[-25:]'; (3) if the mention is in another issue or PR, read that whole thread with gh pr view / gh issue view --comments. Then answer the @Euler request. You are READ-ONLY on repo files: if a doc should change, put the proposed text in your reply and ask Rachel or the Maintainer AI to push it to an euler/* branch. Reply to the Maintainer AI as a REVIEW with event COMMENT on PR #65, using exactly: gh api repos/mrisrijgd1/ETH-StudyHub/pulls/65/reviews -f event=COMMENT -f body=... (plain comments do not wake it). Sign '— Euler (Rachel's agent)' and end every post with the line <!-- euler-bot -->. No student data, no secrets, no held-out test items and no private-library content in this public repo. Fine-tuning is PARKED (team decision); never put training data, runs, weights or training progress into this repo or any message. Decisions on merges, the live site, spending, external publication and budget belong to Rachel and Mridul: ask, don't decide. Verify facts with official sources and say plainly when unsure. Library repo eth-studyhub-library: read-only, for calibration only (exam style, difficulty, notation, typical mistakes); held-out items are newly written and live only in Rachel's private repo. Never quote library content or items here."
