<style>

  --shade:repeating-linear-gradient(135deg,#4cc29b33 0 6px,transparent 6px 12px); color-scheme:dark}}

  --accent:#6b9cff; --accent-ink:#0d1220; --second:#4cc29b; --warn:#ffb85c; --warn-soft:#3a2c14;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}

<body>

<header class="rail"><div class="in">
  <div class="brand">Study planner <small>Test version: rule-based, no AI</small></div>
  <nav class="mods" id="mods" aria-label="Modules"></nav>
  <button type="button" class="btn small" id="calbtn" title="Open the interactive calendar set-up">📅 Calendar</button>
  </div></header>

<!-- Focus trail window (planner/focus-hike.js + .css): kept outside #app, which the planner re-renders -->
<div id="focus-hike"></div>
<link rel="stylesheet" href="planner/focus-hike.css?v=fh1">
<script defer src="planner/focus-hike.js?v=fh1"></script>

<main class="wrap" id="app"></main>

<div class="sheet" id="sheet" hidden></div>

<script>
(function(){
"use strict";
/* ---------- data ---------- */
let PROG=null,SUBJ=[],CH={};
